<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Get ColorCollect</title>
  <meta name="description" content="Pick a color, find it all around you and turn your photos into a montage. Free on Android and iPhone.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="ColorCollect">
  <meta property="og:title" content="ColorCollect — the color hunt photo game">
  <meta property="og:description" content="Pick a color, find it all around you and turn your photos into a montage. Free on Android and iPhone.">
  <meta property="og:image" content="https://colorcollectapp.com/assets/og-home.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center;
      justify-content: center; font-family: system-ui, -apple-system, sans-serif;
      background: #11131a; color: #f4f5f7; text-align: center; padding: 1.5rem;
      box-sizing: border-box;
    }
    .card { max-width: 420px; width: 100%; }
    h1 { font-size: 1.4rem; margin: 0 0 .5rem; }
    p { line-height: 1.55; opacity: .85; margin: .5rem 0; }
    .shot { width: 100%; border-radius: 18px; display: none; margin: 0 0 1rem;
      box-shadow: 0 18px 40px -18px rgba(0,0,0,.7); }
    a.btn {
      display: inline-block; margin-top: 1rem; padding: .85rem 1.5rem;
      border-radius: 999px; background: #6c5ce7; color: #fff;
      text-decoration: none; font-weight: 650;
    }
    .badges { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;
      margin-top: 1.1rem; }
    .badges { align-items: center; }
    .badge { display: inline-flex; line-height: 0; }
    .store-badge-img { display: block; width: auto; }
    .store-badge-img.ios { height: 46px; }
    .store-badge-img.play { height: 68px; margin: -11px; }
    .muted { font-size: .85rem; opacity: .6; margin-top: 1.4rem; }
    .muted a { color: inherit; text-decoration: underline; }

  </style>
</head>
<body>
  <div class="card">
    <h1>ColorCollect</h1>
    <p>Pick a color, find it all around you and turn your photos into a montage. Free.</p>
    <div class="badges">
      <a class="badge" id="play" href="https://play.google.com/store/apps/details?id=dev.colorcollect.color_collect"><img class="store-badge-img play" src="/assets/badges/google-play.png" width="646" height="250" alt="Get it on Google Play"></a>
      <a class="badge" id="ios" href="https://apps.apple.com/app/id6784390996"><img class="store-badge-img ios" src="/assets/badges/app-store.svg" width="120" height="40" alt="Download on the App Store"></a>
    </div>
    <p class="muted"><a href="https://colorcollectapp.com/" style="color: inherit">More about ColorCollect</a></p>
  </div>
  <script>
    var PACKAGE = "dev.colorcollect.color_collect";
    var APP_STORE_ID = "6784390996";
    var params = new URLSearchParams(window.location.search);
    var src = (params.get("utm_source") || "share").replace(/[^A-Za-z0-9_-]/g, "").slice(0, 40);
    var playUrl = "https://play.google.com/store/apps/details?id=" + PACKAGE +
      "&referrer=" + encodeURIComponent("utm_source=" + src + "&utm_medium=app_share&utm_campaign=share");
    var appStoreUrl = "https://apps.apple.com/app/id" + APP_STORE_ID + "?ct=" + encodeURIComponent(src) + "&mt=8";
    document.getElementById("play").href = playUrl;
    document.getElementById("ios").href = appStoreUrl;
    var isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent) ||
                (/Macintosh/i.test(navigator.userAgent) && navigator.maxTouchPoints > 1);
    var isAndroid = /Android/i.test(navigator.userAgent);
    if (isIOS) window.location.replace(appStoreUrl);
    else if (isAndroid) window.location.replace(playUrl);
  </script>
</body>
</html>
