<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Join a ColorCollect hunt</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center;
      justify-content: center; font-family: system-ui, -apple-system, sans-serif;
      background: #11131a; color: #f4f5f7; text-align: center; padding: 1.5rem;
    }
    .card { max-width: 380px; }
    h1 { font-size: 1.4rem; margin: 0 0 .5rem; }
    p { line-height: 1.55; opacity: .85; margin: .5rem 0; }
    .code {
      font-size: 1.9rem; letter-spacing: .25rem; font-weight: 700;
      margin: 1rem 0; padding: .6rem 1rem; border-radius: 12px;
      background: rgba(255,255,255,.08); display: inline-block;
    }
    a.btn {
      display: inline-block; margin-top: 1rem; padding: .8rem 1.4rem;
      border-radius: 999px; background: #6c5ce7; color: #fff;
      text-decoration: none; font-weight: 600;
    }
    .muted { font-size: .85rem; opacity: .6; margin-top: 1.5rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Joining a ColorCollect hunt&hellip;</h1>
    <p id="status">Opening the app&hellip;</p>
    <div class="code" id="code" hidden></div>
    <a class="btn" id="store" href="#">Get ColorCollect free</a>
    <p class="muted"><a id="alt" href="#" style="color: inherit"></a></p>
    <p class="muted" id="manual">
      If the app is installed it should open automatically. Otherwise install it
      and open ColorCollect &mdash; it will offer to join this room. Or tap
      <b>Have a room code?</b> / <b>Join</b> and enter the code above.
    </p>
  </div>

  <script>
    var PACKAGE = "dev.colorcollect.color_collect";
    var APP_STORE_ID = "6784390996";
    function copyLink(text) {
      if (!text) return;
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).catch(function () {});
          return;
        }
      } catch (e) {}
      try {
        var ta = document.createElement("textarea");
        ta.value = text; ta.setAttribute("readonly", "");
        ta.style.position = "fixed"; ta.style.opacity = "0";
        document.body.appendChild(ta); ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
      } catch (e) {}
    }
    var params = new URLSearchParams(window.location.search);
    var code = (params.get("code") || "").toUpperCase();
    if (!code) {
      var parts = window.location.pathname.split("/").filter(Boolean);
      var i = parts.indexOf("join");
      if (i >= 0 && parts[i + 1]) code = decodeURIComponent(parts[i + 1]).toUpperCase();
    }
    var ref = params.get("ref") || "";

    var isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent) ||
                (/Macintosh/i.test(navigator.userAgent) && navigator.maxTouchPoints > 1);

    var referrer = "code=" + encodeURIComponent(code) + (ref ? "&ref=" + encodeURIComponent(ref) : "");
    // Invitees land on the group-first store pages (ColorCollect #20) once
    // PLAY_LISTING_FRIENDS / APP_STORE_PPID_FRIENDS are set; empty = default.
    var PLAY_LISTING = "";
    var APP_STORE_PPID = "";
    var playUrl = "https://play.google.com/store/apps/details?id=" + PACKAGE +
                  (PLAY_LISTING ? "&listing=" + PLAY_LISTING : "") +
                  "&referrer=" + encodeURIComponent(referrer);
    var appStoreUrl = "https://apps.apple.com/app/id" + APP_STORE_ID +
                      (APP_STORE_PPID ? "?ppid=" + APP_STORE_PPID : "");
    var storeUrl = isIOS ? appStoreUrl : playUrl;

    // What the app looks for on first launch (DeferredLinks.fromText): the
    // canonical invite link, copied when the visitor taps through to the store.
    var inviteLink = code
      ? "https://colorcollectapp.com/join/?code=" + encodeURIComponent(code) +
        (ref ? "&ref=" + encodeURIComponent(ref) : "")
      : "";

    var storeEl = document.getElementById("store");
    storeEl.href = storeUrl;
    storeEl.addEventListener("click", function (ev) {
      if (!inviteLink) return;
      ev.preventDefault();
      copyLink(inviteLink);
      setTimeout(function () { window.location.href = storeUrl; }, 150);
    });

    var altEl = document.getElementById("alt");
    altEl.href = isIOS ? playUrl : appStoreUrl;
    altEl.textContent = isIOS ? "Also on Google Play" : "Also on the App Store";

    if (code) {
      var codeEl = document.getElementById("code");
      codeEl.textContent = code;
      codeEl.hidden = false;
    }

    var appUrl = "colorcollect://join/" + encodeURIComponent(code) + (ref ? "?ref=" + encodeURIComponent(ref) : "");
    if (code) {
      try { window.location.href = appUrl; } catch (e) {}
    }

    setTimeout(function () {
      document.getElementById("status").textContent =
        "Don't have the app yet? Install it to join.";
      // Android carries the code through the Play install referrer, so it can
      // go straight on. iOS can only carry it on the clipboard, which needs
      // the tap on the button above.
      if (!isIOS) window.location.href = storeUrl;
    }, 1200);
  </script>
</body>
</html>
